openapi: 3.2.0
info:
  title: Hasura GraphQL Engine HTTP Source Health API
  description: 'Hasura GraphQL Engine exposes a small set of HTTP APIs in addition to its

    GraphQL endpoint.'
  version: 2.0.0
  contact:
    name: Hasura
    url: https://hasura.io/docs/2.0/api-reference/overview/
servers:
- url: https://my-graphql-engine.example.com
  description: Self-hosted Hasura GraphQL Engine
security:
- adminSecret: []
- bearerAuth: []
tags:
- name: Source Health
paths:
  /v1/source_health:
    get:
      summary: Check health of configured data sources
      operationId: sourceHealth
      responses:
        '200':
          description: Source health report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
      - Source Health
components:
  securitySchemes:
    adminSecret:
      type: apiKey
      in: header
      name: x-hasura-admin-secret
      description: Admin secret configured via HASURA_GRAPHQL_ADMIN_SECRET.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token, when JWT authentication is configured.
