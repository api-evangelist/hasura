openapi: 3.2.0
info:
  title: Hasura GraphQL Engine HTTP Healthz API
  description: 'Hasura GraphQL Engine exposes a small set of HTTP APIs in addition to its

    GraphQL endpoint.'
  version: 2.0.0
  contact:
    name: Hasura
    url: https://hasura.io/docs/2.0/api-reference/overview/
servers:
- url: https://my-graphql-engine.example.com
  description: Self-hosted Hasura GraphQL Engine
security:
- adminSecret: []
- bearerAuth: []
tags:
- name: Healthz
paths:
  /healthz:
    get:
      summary: Health check
      description: Returns 200 OK if the server is healthy.
      operationId: health
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Server is unhealthy.
      tags:
      - Healthz
components:
  securitySchemes:
    adminSecret:
      type: apiKey
      in: header
      name: x-hasura-admin-secret
      description: Admin secret configured via HASURA_GRAPHQL_ADMIN_SECRET.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token, when JWT authentication is configured.
